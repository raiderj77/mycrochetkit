name: Verify recovery site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate and build redirect site
        run: npm test

      - name: Confirm production dependency audit
        run: npm audit --omit=dev
